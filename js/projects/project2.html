<!doctype html>
<html lang="en">
  <head>
    <title>Todo List</title>
    <link rel="stylesheet" href="css/p2.css" />
  </head>
  <body>
    <p>Todo List</p>

    <div class="todo-input-grid">
      <input
        placeholder="Todo name"
        class="input-name name"
        onkeydown="handleCostKeydown(event)"
      />

      <input
        type="date"
        class="js-due-date dueDate"
        onkeydown="handleCostKeydown(event)"
      />
      <button class="btn js-btn">Add</button>
    </div>


    <div class="js-todo-list todo-grid"></div>

    <script src="js/p2.js"></script>
  </body>
</html>
