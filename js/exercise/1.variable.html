    <script>
        let name = "Sulav";
        console.log(`My name is ${name}`);

        // 1 cofee $5, 2 bagels $3 each and 1 soup $9
        let coffee = 5;
        let bagel = 3;
        let soup = 9;

        // resturant charges a 10% tax.
